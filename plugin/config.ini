; Splitscreen Support settings.
; Read each time local co-op is switched on: at game start, and when it is
; switched on under Options. Remove a line (or this file) for the default.

[Input]
; Which player keyboard and mouse belong to while a controller is on.
;   2 = the controller is player one, keyboard and mouse are player two (default)
;   1 = keyboard and mouse are player one, the controller is player two
; With two controllers on, 1 only swaps which controller is player one.
; Without any controller, keyboard and mouse are always player one.
KeyboardPlayer=2

; Stick feel during local co-op.
;   1 = the Xbox game's stick response and look sensitivity for both players
;       (default); your own values come back when local co-op is switched off
;   0 = keep your own controller settings (Options > Controller)
XboxSticks=1

[Display]
; The look of menus and HUD. This one needs a restart of the game through the
; launcher, because the layouts are files the launcher installs.
;   1 = the Xbox look (default): console lobby and option pages, button bar at
;       the bottom of the menus, the item cross and console layouts in the HUD
;   0 = the PC look: Valve's PC menus and HUD. Local co-op works the same, and
;       each player's on-screen hints still show their own device's buttons.
ConsoleUI=1

; Console screen margins (only with ConsoleUI=1): like the Xbox, the HUD keeps
; a distance from the edge of the screen (about 5 to 7.5 percent).
;   1 = keep the margins (default)
;   0 = use the whole screen
SafeArea=1
